<script>
/* ===== Versión web: carga el viaje elegido y después el motor (app.js) ===== */
window.GUIA_WEB = true;
window.GUIDE_VER = 'v10 · 31 oct 2026';
(function () {
  'use strict';
  var id = null, m = /[?&]trip=([\w-]+)/.exec(location.search);
  try { id = localStorage.getItem('guia-trip'); } catch (e) {}
  if (m) { id = m[1]; try { localStorage.setItem('guia-trip', id); } catch (e) {} }
  id = id || 'escocia-2026';

  function start(b) {
    window.TRIP_META = b.meta; window.TRAVEL = b.travel || {}; window.TRIP = b.trip;
    window.TRIP_EN = b.trip_en || {}; window.PHOTO_CREDITS = b.credits || [];
    var ph = b.photos || {}, css = Object.keys(ph).map(function (k) {
      return '.ph-' + k + '{background-image:url("' + String(ph[k]).replace(/["\\\n]/g, '') + '")}';
    }).join('\n');
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    if (b.meta && b.meta.title) document.title = (b.meta.title.es || b.meta.title.en || document.title) + ' · Guía de viaje';
    window.TRIP_PHOTOS = ph;
    ['mapa.js', 'app.js'].forEach(function (f) { var sc = document.createElement('script'); sc.src = f; sc.async = false; document.body.appendChild(sc); });
    // todas las fotos del viaje a la caché, para verlas sin cobertura (el service worker las sirve desde ahí)
    if (window.caches && /^https?:$/.test(location.protocol)) setTimeout(function () {
      caches.open('guia-img').then(function (c) {
        Object.keys(ph).forEach(function (k) {
          var u = new URL(ph[k], location.href).href;
          c.match(u).then(function (hit) { if (!hit) return fetch(u, { mode: u.indexOf(location.origin) === 0 ? 'same-origin' : 'no-cors' }).then(function (r) { if (r.ok || r.type === 'opaque') return c.put(u, r); }); }).catch(function () {});
        });
      });
    }, 3000);
  }
  function fail() { try { localStorage.removeItem('guia-trip'); } catch (e) {} location.replace('index.html'); }

  // viajes creados en el móvil (asistente o importados): IndexedDB «guia-trips»
  if (/^u-/.test(id)) {
    if (!window.indexedDB) return fail();
    var q = indexedDB.open('guia-trips', 1);
    q.onupgradeneeded = function () { q.result.createObjectStore('trips', { keyPath: 'id' }); };
    q.onerror = fail;
    q.onsuccess = function () {
      var g = q.result.transaction('trips', 'readonly').objectStore('trips').get(id);
      g.onsuccess = function () { if (g.result && g.result.bundle) start(g.result.bundle); else fail(); };
      g.onerror = fail;
    };
  } else {
    fetch('trips/' + id + '.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(start, fail);
  }
})();

</script>
